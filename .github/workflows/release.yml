name: Release

on:
  push:
    tags:
      - 'V*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx rollup -c

      - name: Copy to root for HACS
        run: cp dist/global-cards.js global-cards.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: global-cards.js
          generate_release_notes: false
